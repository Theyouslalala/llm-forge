# LLM-Forge Pretrain Configuration
# GPT-style Causal Language Model Pretraining

model:
  vocab_size: 32000
  max_seq_len: 1024
  d_model: 768
  n_heads: 12
  n_layers: 12
  d_ff: 3072
  dropout: 0.1
  tie_weights: true
  rope_theta: 10000.0

tokenizer:
  vocab_size: 32000
  model_type: "bpe"
  special_tokens:
    pad: "<pad>"
    unk: "<unk>"
    bos: "<bos>"
    eos: "<eos>"

training:
  output_dir: "./outputs/pretrain"
  num_epochs: 10
  batch_size: 16
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-4
  weight_decay: 0.1
  max_grad_norm: 1.0
  warmup_steps: 2000
  lr_scheduler: "cosine"
  fp16: true
  save_steps: 1000
  log_steps: 100
  eval_steps: 500

data:
  train_file: "./data/pretrain/train.txt"
  eval_file: "./data/pretrain/eval.txt"
  max_length: 1024
  preprocessing_num_workers: 4
